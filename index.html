<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALERTA MX</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    header {
      background: #b00020;
      color: white;
      text-align: center;
      padding: 22px;
      font-size: 27px;
      font-weight: bold;
    }

    main {
      max-width: 550px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .red { background: #b00020; color: white; }
    .dark { background: #222; color: white; }
    .blue { background: #1769e0; color: white; }
    .green { background: #16803c; color: white; }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    .hidden {
      display: none;
    }

    .bienvenida {
      font-weight: bold;
      color: #16803c;
    }

    .admin {
      border-left: 5px solid #b00020;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  🚨 ALERTA MX
</header>

<main>

  <!-- INICIO -->
  <section class="card" id="inicio">

    <h2>Bienvenido a ALERTA MX</h2>

    <p>
      Plataforma para consultar y gestionar información
      relacionada con personas desaparecidas.
    </p>

    <button class="red" onclick="mostrarLogin()">
      👤 Iniciar sesión
    </button>

  </section>


  <!-- LOGIN -->
  <section class="card hidden" id="login">

    <h2>Iniciar sesión</h2>

    <input
      id="email"
      type="email"
      placeholder="Correo electrónico"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
    >

    <button class="blue" onclick="iniciarSesion()">
      Entrar
    </button>

    <p id="mensaje"></p>

  </section>


  <!-- PANEL USUARIO -->
  <section class="card hidden" id="panelUsuario">

    <h2>👤 Panel de usuario</h2>

    <p class="bienvenida" id="usuarioNombre"></p>

    <button class="red" onclick="reportar()">
      🚨 Reportar desaparición
    </button>

    <button class="dark" onclick="buscar()">
      🔎 Buscar persona
    </button>

    <button class="green" onclick="cerrarSesion()">
      🚪 Cerrar sesión
    </button>

  </section>


  <!-- PANEL ADMINISTRADOR -->
  <section class="card admin hidden" id="panelAdmin">

    <h2>🛡️ Panel de administrador</h2>

    <p class="bienvenida" id="adminNombre"></p>

    <button class="red" onclick="verAlertas()">
      🚨 Gestionar alertas
    </button>

    <button class="blue" onclick="verUsuarios()">
      👥 Gestionar usuarios
    </button>

    <button class="dark" onclick="buscar()">
      🔎 Buscar persona
    </button>

    <button class="green" onclick="cerrarSesion()">
      🚪 Cerrar sesión
    </button>

    <p id="adminMensaje"></p>

  </section>

</main>

<footer>
  ALERTA MX © 2026
</footer>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* FIREBASE */

  const firebaseConfig = {
    apiKey: "AIzaSyATc2OT-2u-UcBerDy7wVYu4DGat3MyB0E",
    authDomain: "alerta-mx-42492.firebaseapp.com",
    projectId: "alerta-mx-42492",
    storageBucket: "alerta-mx-42492.firebasestorage.app",
    messagingSenderId: "17765892560",
    appId: "1:17765892560:web:29a16191b3155eae2c39d5",
    measurementId: "G-4Y6N9Q47XB"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* MOSTRAR LOGIN */

  window.mostrarLogin = function() {

    document.getElementById("inicio")
      .classList.add("hidden");

    document.getElementById("login")
      .classList.remove("hidden");

  };


  /* INICIAR SESIÓN */

  window.iniciarSesion = async function() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const mensaje =
      document.getElementById("mensaje");


    if (!email || !password) {

      mensaje.innerText =
        "⚠️ Escribe correo y contraseña.";

      return;
    }


    mensaje.innerText =
      "🔐 Iniciando sesión...";


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    } catch (error) {

      console.error(error);

      mensaje.innerText =
        "❌ Correo o contraseña incorrectos.";

    }

  };


  /* COMPROBAR USUARIO */

  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      document
        .getElementById("panelUsuario")
        .classList.add("hidden");

      document
        .getElementById("panelAdmin")
        .classList.add("hidden");

      return;
    }


    const referencia =
      doc(db, "usuarios", user.uid);


    try {

      const documento =
        await getDoc(referencia);


      if (!documento.exists()) {

        document
          .getElementById("panelUsuario")
          .classList.remove("hidden");

        document
          .getElementById("usuarioNombre")
          .innerText =
          "Sesión iniciada: " + user.email;

        return;
      }


      const datos =
        documento.data();


      document
        .getElementById("login")
        .classList.add("hidden");


      if (datos.rol === "admin") {

        document
          .getElementById("panelAdmin")
          .classList.remove("hidden");

        document
          .getElementById("adminNombre")
          .innerText =
          "Administrador: " + user.email;

      } else {

        document
          .getElementById("panelUsuario")
          .classList.remove("hidden");

        document
          .getElementById("usuarioNombre")
          .innerText =
          "Usuario: " + user.email;

      }

    } catch (error) {

      console.error(error);

      document
        .getElementById("mensaje")
        .innerText =
        "❌ No se pudo consultar el perfil.";

    }

  });


  /* CERRAR SESIÓN */

  window.cerrarSesion = async function() {

    await signOut(auth);

    location.reload();

  };


  /* FUNCIONES TEMPORALES */

  window.reportar = function() {

    alert(
      "Aquí construiremos el formulario para reportar una desaparición."
    );

  };


  window.buscar = function() {

    alert(
      "Aquí construiremos el buscador de personas."
    );

  };


  window.verAlertas = function() {

    document.getElementById("adminMensaje").innerText =
      "🚨 El módulo de gestión de alertas se construirá en el siguiente paso.";

  };


  window.verUsuarios = function() {

    document.getElementById("adminMensaje").innerText =
      "👥 El módulo de usuarios se construirá en el siguiente paso.";

  };

</script>

</body>
</html>
