<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ALERTA MX</title>

<style>
body{margin:0;font-family:Arial;background:#f3f3f3;color:#222}
header{background:#b00020;color:white;text-align:center;padding:22px;font-size:28px;font-weight:bold}
.contenedor{max-width:550px;margin:auto;padding:20px}
.card{background:white;padding:22px;margin-bottom:18px;border-radius:15px;box-shadow:0 3px 12px #0002}
input{width:100%;padding:14px;margin-top:10px;border:1px solid #bbb;border-radius:8px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:9px;font-size:16px;font-weight:bold}
.azul{background:#1769e0;color:white}
.rojo{background:#b00020;color:white}
.negro{background:#222;color:white}
.verde{background:#16803c;color:white}
.gris{background:#666;color:white}
.oculto{display:none}
.mensaje{font-weight:bold;margin-top:15px}
.reporte{border:1px solid #ddd;border-radius:10px;padding:15px;margin-top:15px}
.estado{font-weight:bold}
</style>
</head>

<body>

<header>🚨 ALERTA MX</header>

<div class="contenedor">

<section class="card" id="login">
<h2>Iniciar sesión</h2>

<input id="email" type="email" placeholder="Correo electrónico">
<input id="password" type="password" placeholder="Contraseña">

<button class="azul" id="entrar">Entrar</button>

<p class="mensaje" id="mensaje"></p>
</section>


<section class="card oculto" id="panelAdmin">

<h2>🛡️ Panel de administrador</h2>

<p id="adminCorreo"></p>

<button class="rojo" id="alertas">
🚨 Gestionar alertas
</button>

<button class="azul" id="usuarios">
👥 Gestionar usuarios
</button>

<button class="negro" id="buscar">
🔎 Buscar persona
</button>

<button class="verde" id="salir">
🚪 Cerrar sesión
</button>

<p class="mensaje" id="panelMensaje"></p>

</section>


<section class="card oculto" id="panelUsuario">

<h2>👤 Panel de usuario</h2>

<p id="usuarioCorreo"></p>

<button class="rojo" id="reportar">
🚨 Reportar desaparición
</button>

<button class="negro" id="buscarUsuario">
🔎 Buscar persona
</button>

<button class="verde" id="salirUsuario">
🚪 Cerrar sesión
</button>

</section>


<section class="card oculto" id="listaAlertas">

<h2>📋 Gestionar alertas</h2>

<p>
Aquí aparecen los reportes enviados a ALERTA MX.
</p>

<div id="contenidoAlertas">
Cargando reportes...
</div>

<button class="gris" id="volverPanel">
⬅️ Volver al panel
</button>

</section>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
apiKey:"AIzaSyATc2OT-2u-UcBerDy7wVYu4DGat3MyB0E",
authDomain:"alerta-mx-42492.firebaseapp.com",
projectId:"alerta-mx-42492",
storageBucket:"alerta-mx-42492.firebasestorage.app",
messagingSenderId:"17765892560",
appId:"1:17765892560:web:29a16191b3155eae2c39d5"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


const login=document.getElementById("login");
const panelAdmin=document.getElementById("panelAdmin");
const panelUsuario=document.getElementById("panelUsuario");
const listaAlertas=document.getElementById("listaAlertas");


/* INICIAR SESIÓN */

document.getElementById("entrar")
.addEventListener("click",async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const mensaje=document.getElementById("mensaje");

if(!email||!password){

mensaje.textContent="⚠️ Escribe correo y contraseña.";
return;

}

mensaje.textContent="🔐 Iniciando sesión...";

try{

await signInWithEmailAndPassword(auth,email,password);

}catch(error){

console.error(error);
mensaje.textContent="❌ Correo o contraseña incorrectos.";

}

});


/* DETECTAR USUARIO */

onAuthStateChanged(auth,async(user)=>{

if(!user){

login.classList.remove("oculto");
panelAdmin.classList.add("oculto");
panelUsuario.classList.add("oculto");
listaAlertas.classList.add("oculto");

return;

}

try{

const {getFirestore,doc,getDoc}=await import(
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
);

const referencia=doc(db,"usuarios",user.uid);
const resultado=await getDoc(referencia);

login.classList.add("oculto");

if(resultado.exists() && resultado.data().rol==="admin"){

panelAdmin.classList.remove("oculto");
panelUsuario.classList.add("oculto");

document.getElementById("adminCorreo").textContent=
"Administrador: "+user.email;

}else{

panelUsuario.classList.remove("oculto");
panelAdmin.classList.add("oculto");

document.getElementById("usuarioCorreo").textContent=
"Usuario: "+user.email;

}

}catch(error){

console.error(error);

login.classList.remove("oculto");

document.getElementById("mensaje").textContent=
"❌ No se pudo consultar el perfil.";

}

});


/* GESTIONAR ALERTAS */

document.getElementById("alertas")
.addEventListener("click",async()=>{

panelAdmin.classList.add("oculto");
listaAlertas.classList.remove("oculto");

const contenido=
document.getElementById("contenidoAlertas");

contenido.innerHTML="🔄 Cargando reportes...";


try{

const referencia=
collection(db,"reportes");

const consulta=
query(referencia,orderBy("creadoEn","desc"));

const resultados=
await getDocs(consulta);


if(resultados.empty){

contenido.innerHTML=
"<p>📭 No hay reportes registrados todavía.</p>";

return;

}


contenido.innerHTML="";


resultados.forEach((documento)=>{

const datos=documento.data();

const tarjeta=
document.createElement("div");

tarjeta.className="reporte";

tarjeta.innerHTML=`

<h3>🚨 ${datos.nombre || "Sin nombre"}</h3>

<p>
<b>Edad:</b>
${datos.edad ?? "No indicada"}
</p>

<p>
<b>Sexo:</b>
${datos.sexo || "No indicado"}
</p>

<p>
<b>Fecha de desaparición:</b>
${datos.fechaDesaparicion || "No indicada"}
</p>

<p>
<b>Lugar:</b>
${datos.lugarDesaparicion || "No indicado"}
</p>

<p>
<b>Ciudad / Estado:</b>
${datos.ciudadDesaparicion || "No indicado"}
</p>

<p>
<b>Ropa:</b>
${datos.ropa || "No indicada"}
</p>

<p>
<b>Descripción:</b>
${datos.descripcion || "Sin descripción"}
</p>

<p>
<b>Contacto:</b>
${datos.contacto || "No indicado"}
</p>

<p class="estado">
Estado:
${datos.estado || "pendiente"}
</p>

`;

contenido.appendChild(tarjeta);

});


}catch(error){

console.error(error);

contenido.innerHTML=
"❌ No se pudieron cargar los reportes.";

}

});


/* VOLVER */

document.getElementById("volverPanel")
.addEventListener("click",()=>{

listaAlertas.classList.add("oculto");
panelAdmin.classList.remove("oculto");

});


/* BOTONES TEMPORALES */

document.getElementById("usuarios")
.addEventListener("click",()=>{

document.getElementById("panelMensaje").textContent=
"👥 El módulo de usuarios será el siguiente.";

});


document.getElementById("buscar")
.addEventListener("click",()=>{

document.getElementById("panelMensaje").textContent=
"🔎 El buscador será el siguiente.";

});


document.getElementById("reportar")
.addEventListener("click",()=>{

alert("El formulario de reportes se agregará después.");

});


document.getElementById("buscarUsuario")
.addEventListener("click",()=>{

alert("El buscador se agregará después.");

});


/* CERRAR SESIÓN */

async function cerrarSesion(){

await signOut(auth);

}

document.getElementById("salir")
.addEventListener("click",cerrarSesion);

document.getElementById("salirUsuario")
.addEventListener("click",cerrarSesion);

</script>

</body>
</html>
