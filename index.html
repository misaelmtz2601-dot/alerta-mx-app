<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALERTA MX - Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
    }

    header {
      background: #b00020;
      color: white;
      text-align: center;
      padding: 22px;
      font-size: 28px;
      font-weight: bold;
    }

    .contenedor {
      max-width: 450px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px #0002;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 9px;
      background: #1769e0;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #resultado {
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  🚨 ALERTA MX
</header>

<div class="contenedor">

  <div class="card">

    <h2>Iniciar sesión</h2>

    <input
      id="email"
      type="email"
      placeholder="Correo electrónico"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
    >

    <button id="botonLogin">
      Entrar
    </button>

    <p id="resultado"></p>

  </div>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  const firebaseConfig = {

    apiKey: "AIzaSyATc2OT-2u-UcBerDy7wVYu4DGat3MyB0E",

    authDomain: "alerta-mx-42492.firebaseapp.com",

    projectId: "alerta-mx-42492",

    storageBucket: "alerta-mx-42492.firebasestorage.app",

    messagingSenderId: "17765892560",

    appId: "1:17765892560:web:29a16191b3155eae2c39d5"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);


  document
    .getElementById("botonLogin")
    .addEventListener("click", async () => {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const resultado =
        document.getElementById("resultado");


      if (!email || !password) {

        resultado.innerText =
          "⚠️ Escribe correo y contraseña.";

        return;
      }


      resultado.innerText =
        "🔐 Iniciando sesión...";


      try {

        const credencial =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        resultado.innerText =
          "✅ SESIÓN INICIADA: " +
          credencial.user.email;


      } catch (error) {

        console.error(error);

        resultado.innerText =
          "❌ Error: " + error.code;

      }

    });

</script>

</body>
</html>
