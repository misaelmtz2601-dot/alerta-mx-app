<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALERTA MX</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
    }

    header {
      background: #b00020;
      color: white;
      text-align: center;
      padding: 22px;
      font-size: 28px;
      font-weight: bold;
    }

    .contenedor {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px #0002;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .azul {
      background: #1769e0;
    }

    .rojo {
      background: #b00020;
    }

    .negro {
      background: #222;
    }

    .verde {
      background: #16803c;
    }

    .gris {
      background: #666;
    }

    .oculto {
      display: none;
    }

    #resultado,
    #panelMensaje {
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  🚨 ALERTA MX
</header>

<div class="contenedor">

  <!-- LOGIN -->

  <div class="card" id="login">

    <h2>Iniciar sesión</h2>

    <input
      id="email"
      type="email"
      placeholder="Correo electrónico"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
    >

    <button class="azul" id="botonLogin">
      Entrar
    </button>

    <p id="resultado"></p>

  </div>


  <!-- PANEL ADMIN -->

  <div class="card oculto" id="panelAdmin">

    <h2>🛡️ Panel de administrador</h2>

    <p id="adminCorreo"></p>

    <button class="rojo" id="gestionarAlertas">
      🚨 Gestionar alertas
    </button>

    <button class="azul" id="usuarios">
      👥 Usuarios
    </button>

    <button class="negro" id="buscar">
      🔎 Buscar persona
    </button>

    <button class="verde" id="cerrarSesion">
      🚪 Cerrar sesión
    </button>

    <p id="panelMensaje"></p>

  </div>


  <!-- PANTALLA DE ALERTAS -->

  <div class="card oculto" id="pantallaAlertas">

    <h2>🚨 Gestionar alertas</h2>

    <p>
      Aquí aparecerán los reportes enviados a ALERTA MX.
    </p>

    <p>
      📭 No hay reportes registrados todavía.
    </p>

    <button class="gris" id="volver">
      ⬅️ Volver al panel
    </button>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
  }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyATc2OT-2u-UcBerDy7wVYu4DGat3MyB0E",

    authDomain:
      "alerta-mx-42492.firebaseapp.com",

    projectId:
      "alerta-mx-42492",

    storageBucket:
      "alerta-mx-42492.firebasestorage.app",

    messagingSenderId:
      "17765892560",

    appId:
      "1:17765892560:web:29a16191b3155eae2c39d5"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);


  const login =
    document.getElementById("login");

  const panelAdmin =
    document.getElementById("panelAdmin");

  const pantallaAlertas =
    document.getElementById("pantallaAlertas");

  const resultado =
    document.getElementById("resultado");


  /* INICIAR SESIÓN */

  document
    .getElementById("botonLogin")
    .addEventListener("click", async () => {

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;


      if (!email || !password) {

        resultado.innerText =
          "⚠️ Escribe correo y contraseña.";

        return;
      }


      resultado.innerText =
        "🔐 Iniciando sesión...";


      try {

        const credencial =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        /*

        POR AHORA EL ADMINISTRADOR
        SE IDENTIFICA POR ESTE CORREO.

        */

        if (
          credencial.user.email ===
          "admin@alertamx.app"
        ) {

          login.classList.add("oculto");

          panelAdmin.classList.remove("oculto");

          document
            .getElementById("adminCorreo")
            .innerText =
            "Administrador: " +
            credencial.user.email;

        } else {

          resultado.innerText =
            "✅ Sesión iniciada: " +
            credencial.user.email;

        }


      } catch (error) {

        console.error(error);

        resultado.innerText =
          "❌ Error: " +
          error.code;

      }

    });


  /* GESTIONAR ALERTAS */

  document
    .getElementById("gestionarAlertas")
    .addEventListener("click", () => {

      panelAdmin.classList.add("oculto");

      pantallaAlertas.classList.remove("oculto");

    });


  /* VOLVER */

  document
    .getElementById("volver")
    .addEventListener("click", () => {

      pantallaAlertas.classList.add("oculto");

      panelAdmin.classList.remove("oculto");

    });


  /* USUARIOS */

  document
    .getElementById("usuarios")
    .addEventListener("click", () => {

      document
        .getElementById("panelMensaje")
        .innerText =
        "👥 El módulo de usuarios lo construiremos después.";

    });


  /* BUSCAR */

  document
    .getElementById("buscar")
    .addEventListener("click", () => {

      document
        .getElementById("panelMensaje")
        .innerText =
        "🔎 El buscador lo construiremos después.";

    });


  /* CERRAR SESIÓN */

  document
    .getElementById("cerrarSesion")
    .addEventListener("click", async () => {

      await signOut(auth);

      location.reload();

    });

</script>

</body>
</html>
