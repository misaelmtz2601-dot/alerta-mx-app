<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALERTA MX - Alertas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    header {
      background: #b00020;
      color: white;
      text-align: center;
      padding: 22px 15px;
      font-size: 28px;
      font-weight: bold;
    }

    .contenedor {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }

    .encabezado {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
      margin-bottom: 20px;
    }

    .encabezado h1 {
      margin-top: 0;
      color: #b00020;
    }

    .caso {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
      border-left: 6px solid #b00020;
    }

    .caso h2 {
      margin-top: 0;
      color: #b00020;
    }

    .dato {
      margin: 10px 0;
      line-height: 1.5;
    }

    .estado {
      display: inline-block;
      background: #16803c;
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: bold;
      margin-top: 8px;
    }

    .cargando,
    .vacio,
    .error {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .error {
      color: #b00020;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  🚨 ALERTA MX
</header>


<div class="contenedor">

  <div class="encabezado">

    <h1>Personas desaparecidas</h1>

    <p>
      Consulta las alertas que han sido
      revisadas y aprobadas por ALERTA MX.
    </p>

  </div>


  <div id="lista">

    <div class="cargando">
      🔄 Cargando alertas...
    </div>

  </div>

</div>


<footer>
  ALERTA MX © 2026
</footer>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
  }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* FIREBASE */

  const firebaseConfig = {

    apiKey:
      "AIzaSyATc2OT-2u-UcBerDy7wVYu4DGat3MyB0E",

    authDomain:
      "alerta-mx-42492.firebaseapp.com",

    projectId:
      "alerta-mx-42492",

    storageBucket:
      "alerta-mx-42492.firebasestorage.app",

    messagingSenderId:
      "17765892560",

    appId:
      "1:17765892560:web:29a16191b3155eae2c39d5"

  };


  const app =
    initializeApp(firebaseConfig);


  const db =
    getFirestore(app);


  const lista =
    document.getElementById("lista");


  /* CARGAR SOLO CASOS APROBADOS */

  async function cargarAlertas() {

    lista.innerHTML = `
      <div class="cargando">
        🔄 Cargando alertas...
      </div>
    `;


    try {

      const consulta = query(

        collection(db, "casos"),

        where(
          "estado",
          "==",
          "aprobado"
        )

      );


      const resultados =
        await getDocs(consulta);


      /* NO HAY ALERTAS */

      if (resultados.empty) {

        lista.innerHTML = `
          <div class="vacio">

            <h2>📭 No hay alertas</h2>

            <p>
              Actualmente no hay personas
              desaparecidas con una alerta aprobada.
            </p>

          </div>
        `;

        return;
      }


      lista.innerHTML = "";


      /* MOSTRAR CASOS */

      resultados.forEach((documento) => {

        const caso =
          documento.data();


        const tarjeta =
          document.createElement("div");


        tarjeta.className =
          "caso";


        /* TÍTULO */

        const titulo =
          document.createElement("h2");

        titulo.textContent =
          "🚨 " +
          (caso.nombre || "Sin nombre");


        tarjeta.appendChild(titulo);


        /* EDAD */

        const edad =
          document.createElement("p");

        edad.className =
          "dato";

        edad.innerHTML =
          "<strong>Edad:</strong> " +
          (caso.edad ?? "No indicada");


        tarjeta.appendChild(edad);


        /* SEXO */

        const sexo =
          document.createElement("p");

        sexo.className =
          "dato";

        sexo.innerHTML =
          "<strong>Sexo:</strong> " +
          (caso.sexo || "No indicado");


        tarjeta.appendChild(sexo);


        /* FECHA */

        const fecha =
          document.createElement("p");

        fecha.className =
          "dato";

        fecha.innerHTML =
          "<strong>Fecha de desaparición:</strong> " +
          (caso.fechaDesaparicion ||
           "No indicada");


        tarjeta.appendChild(fecha);


        /* LUGAR */

        const lugar =
          document.createElement("p");

        lugar.className =
          "dato";

        lugar.innerHTML =
          "<strong>Último lugar donde fue vista:</strong> " +
          (caso.lugarDesaparicion ||
           "No indicado");


        tarjeta.appendChild(lugar);


        /* CIUDAD */

        const ciudad =
          document.createElement("p");

        ciudad.className =
          "dato";

        ciudad.innerHTML =
          "<strong>Ciudad / Estado:</strong> " +
          (caso.ciudad ||
           "No indicado");


        tarjeta.appendChild(ciudad);


        /* ROPA */

        const ropa =
          document.createElement("p");

        ropa.className =
          "dato";

        ropa.innerHTML =
          "<strong>Ropa que llevaba:</strong> " +
          (caso.ropa ||
           "No indicada");


        tarjeta.appendChild(ropa);


        /* DESCRIPCIÓN */

        const descripcion =
          document.createElement("p");

        descripcion.className =
          "dato";

        descripcion.innerHTML =
          "<strong>Descripción:</strong> " +
          (caso.descripcion ||
           "Sin descripción");


        tarjeta.appendChild(descripcion);


        /* CONTACTO */

        if (caso.contacto) {

          const contacto =
            document.createElement("p");

          contacto.className =
            "dato";

          contacto.innerHTML =
            "<strong>Contacto:</strong> " +
            caso.contacto;

          tarjeta.appendChild(contacto);

        }


        /* ESTADO */

        const estado =
          document.createElement("div");

        estado.className =
          "estado";

        estado.textContent =
          "🟢 ALERTA APROBADA";


        tarjeta.appendChild(estado);


        /* AGREGAR A LA PÁGINA */

        lista.appendChild(tarjeta);

      });


    } catch (error) {

      console.error(
        "Error de Firestore:",
        error
      );


      lista.innerHTML = `
        <div class="error">

          <h2>
            ❌ No se pudieron cargar las alertas
          </h2>

          <p>
            No fue posible consultar
            la base de datos.
          </p>

          <p>
            Código: ${error.code || "desconocido"}
          </p>

        </div>
      `;

    }

  }


  /* INICIAR */

  cargarAlertas();

</script>

</body>
</html>
