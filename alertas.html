<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALERTA MX - Alertas</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f3f3;
  color:#222;
}

header{
  background:#b00020;
  color:white;
  text-align:center;
  padding:22px 15px;
  font-size:28px;
  font-weight:bold;
}

.contenedor{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:20px;
}

.encabezado{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
  margin-bottom:20px;
}

.encabezado h1{
  margin-top:0;
  color:#b00020;
}

.busqueda{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.busqueda input{
  flex:1;
  min-width:0;
  padding:14px;
  border:1px solid #bbb;
  border-radius:9px;
  font-size:16px;
}

.busqueda button{
  padding:14px 18px;
  border:0;
  border-radius:9px;
  background:#b00020;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.limpiar{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#666;
  color:white;
  font-weight:bold;
}

.caso{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
  border-left:6px solid #b00020;
}

.caso h2{
  margin-top:0;
  color:#b00020;
}

.dato{
  margin:10px 0;
  line-height:1.5;
}

.estado{
  display:inline-block;
  background:#16803c;
  color:white;
  padding:8px 12px;
  border-radius:20px;
  font-weight:bold;
  margin-top:8px;
}

.mapa{
  display:block;
  width:100%;
  margin-top:15px;
  padding:14px;
  background:#1769e0;
  color:white;
  text-align:center;
  text-decoration:none;
  border-radius:9px;
  font-weight:bold;
}

.cargando,
.vacio,
.error{
  background:white;
  padding:25px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.error{
  color:#b00020;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
🚨 ALERTA MX
</header>

<div class="contenedor">

<div class="encabezado">

<h1>Personas desaparecidas</h1>

<p>
Consulta las alertas aprobadas de ALERTA MX.
</p>

<div class="busqueda">

<input
id="buscador"
type="search"
placeholder="🔎 Escribe el nombre..."
autocomplete="off">

<button id="btnBuscar">
Buscar
</button>

</div>

<button
class="limpiar"
id="btnLimpiar">
Mostrar todas las alertas
</button>

</div>


<div id="lista">

<div class="cargando">
🔄 Cargando alertas...
</div>

</div>

</div>

<footer>
ALERTA MX © 2026
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyATc2OT-2u-UcBerDy7wVYu4DGat3MyB0E",

authDomain:
"alerta-mx-42492.firebaseapp.com",

projectId:
"alerta-mx-42492",

storageBucket:
"alerta-mx-42492.firebasestorage.app",

messagingSenderId:
"17765892560",

appId:
"1:17765892560:web:29a16191b3155eae2c39d5"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


const lista =
document.getElementById("lista");

const buscador =
document.getElementById("buscador");


let casosAprobados = [];


/* CARGAR CASOS */

async function cargarAlertas(){

lista.innerHTML = `
<div class="cargando">
🔄 Cargando alertas...
</div>
`;

try{

const consulta = query(
collection(db,"casos"),
where("estado","==","aprobado")
);

const resultados =
await getDocs(consulta);


casosAprobados = [];


resultados.forEach((documento)=>{

casosAprobados.push({
id:documento.id,
...documento.data()
});

});


mostrarCasos(casosAprobados);


}catch(error){

console.error(error);

lista.innerHTML = `
<div class="error">

<h2>❌ No se pudieron cargar las alertas</h2>

<p>
Código: ${error.code || "desconocido"}
</p>

</div>
`;

}

}


/* MOSTRAR CASOS */

function mostrarCasos(casos){

lista.innerHTML="";


if(casos.length===0){

lista.innerHTML=`

<div class="vacio">

<h2>📭 No se encontraron alertas</h2>

<p>
No hay casos aprobados que coincidan
con tu búsqueda.
</p>

</div>

`;

return;

}


casos.forEach((caso)=>{

const tarjeta =
document.createElement("div");

tarjeta.className="caso";


tarjeta.innerHTML=`

<h2>
🚨 ${escapar(caso.nombre || "Sin nombre")}
</h2>

<p class="dato">
<strong>Edad:</strong>
${escapar(caso.edad ?? "No indicada")}
</p>

<p class="dato">
<strong>Sexo:</strong>
${escapar(caso.sexo || "No indicado")}
</p>

<p class="dato">
<strong>Fecha de desaparición:</strong>
${escapar(caso.fechaDesaparicion || "No indicada")}
</p>

<p class="dato">
<strong>Último lugar donde fue vista:</strong>
${escapar(caso.lugarDesaparicion || "No indicado")}
</p>

<p class="dato">
<strong>Ciudad / Estado:</strong>
${escapar(caso.ciudad || "No indicado")}
</p>

<p class="dato">
<strong>Ropa que llevaba:</strong>
${escapar(caso.ropa || "No indicada")}
</p>

<p class="dato">
<strong>Descripción:</strong>
${escapar(caso.descripcion || "Sin descripción")}
</p>

${
caso.coordenadas
?
`
<p class="dato">
<strong>📍 Última ubicación conocida:</strong><br>
${escapar(caso.coordenadas)}
</p>

<a
class="mapa"
href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(caso.coordenadas)}"
target="_blank"
rel="noopener noreferrer">
🗺️ Ver ubicación en mapa
</a>
`
:
`
<p class="dato">
<strong>📍 Ubicación:</strong>
No disponible
</p>
`
}

${
caso.contacto
?
`
<p class="dato">
<strong>Contacto:</strong>
${escapar(caso.contacto)}
</p>
`
:
""
}

<div class="estado">
🟢 ALERTA APROBADA
</div>

`;

lista.appendChild(tarjeta);

});

}


/* BUSCAR */

function buscar(){

const texto =
buscador.value
.trim()
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");


if(!texto){

mostrarCasos(casosAprobados);

return;

}


const resultados =
casosAprobados.filter((caso)=>{

const nombre =
String(caso.nombre || "")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");

return nombre.includes(texto);

});


mostrarCasos(resultados);

}


/* BOTÓN BUSCAR */

document
.getElementById("btnBuscar")
.addEventListener(
"click",
buscar
);


/* BUSCAR AL ESCRIBIR */

buscador.addEventListener(
"input",
buscar
);


/* ENTER */

buscador.addEventListener(
"keydown",
(event)=>{

if(event.key==="Enter"){
buscar();
}

});


/* LIMPIAR */

document
.getElementById("btnLimpiar")
.addEventListener(
"click",
()=>{

buscador.value="";

mostrarCasos(casosAprobados);

}
);


/* SEGURIDAD DEL TEXTO */

function escapar(valor){

return String(valor)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* INICIAR */

cargarAlertas();

</script>

</body>
</html>
